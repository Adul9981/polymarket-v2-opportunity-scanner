# Clean public path for the Danmu Intelligence site.
# Deploy this file as /etc/nginx/snippets/danmu-path.conf and include it
# inside the danmu-pulse server block. /var/www/danmu must symlink to
# /var/www/danmu-pulse so static assets keep their existing relative layout.

location = / {
    return 301 /danmu/;
}

location = /index.html {
    return 301 /danmu/;
}

location = /danmu {
    return 301 /danmu/;
}

location ^~ /danmu/ {
    root /var/www;
    index index.html;
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache";
}
